services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      MAX_UPLOAD_SIZE_MB: "50"
      # Swap for PostgreSQL by adding `asyncpg` to requirements.txt, e.g.:
      # DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/geo
    volumes:
      - geo_data:/app/data_store
      - geo_uploads:/app/uploads
    restart: unless-stopped

volumes:
  geo_data:
  geo_uploads:
